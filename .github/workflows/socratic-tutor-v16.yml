name: Socratic Tutor v1.6 release gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: socratic-v16-${{ github.ref }}
  cancel-in-progress: true

jobs:
  releasecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GEMINI_API_KEY: ""
      OPENAI_API_KEY: ""
      LLM_ENABLED: "false"
      SOCRATIC_TUTOR_ENABLED: "false"
      SOCRATIC_TUTOR_LLM_ENABLED: "false"
    steps:
      - name: Checkout proposed revision only
        uses: actions/checkout@v4
      - name: Build isolated release-check image (offline AI)
        run: docker build --progress=plain --file Dockerfile.releasecheck --tag phy-ai-socratic-v16:ci .
      - name: Export 1,000-question review queue (no student data)
        run: |
          docker run --rm --entrypoint python phy-ai-socratic-v16:ci /app/scripts/audit_ontology_v6.py | sed -n '/^{/,$p' > question-bank-quality-v6.json
          python - <<'PY'
          import json
          d=json.load(open("question-bank-quality-v6.json",encoding="utf-8"))
          print({"items":d["question_count"],"underprobed":d["ontology_underprobed_count"],"near_clone_groups":len(d["same_numeric_template_groups"])})
          assert d["question_count"]==1000
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phy-ai-question-bank-quality-v6
          path: question-bank-quality-v6.json
          retention-days: 14
      - name: Export complete V6 versioned question bank
        run: |
          docker run --rm --entrypoint sh phy-ai-socratic-v16:ci -c 'python /app/scripts/validate_audited_bank.py --export /tmp/PHY_AI_DIAGNOSE_1000_V6.json >/dev/null && cat /tmp/PHY_AI_DIAGNOSE_1000_V6.json' > PHY_AI_DIAGNOSE_1000_V6.json
          python - <<'PY'
          import json
          from collections import Counter
          d=json.load(open("PHY_AI_DIAGNOSE_1000_V6.json",encoding="utf-8"))
          questions=d["questions"]
          assert len(questions)==1000
          assert d["version"]=="2026.10-1000q-v6-content-evidence"
          assert sum(str(q["id"]).endswith("-V6") for q in questions)==8
          print("V6 exported",len(questions),"questions",dict(Counter(q["chapter"] for q in questions)))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: PHY_AI_DIAGNOSE_1000_V6_complete_bank
          path: PHY_AI_DIAGNOSE_1000_V6.json
          retention-days: 14
      - name: Smoke check API and Socratic feature-off on temporary SQLite
        run: |
          set -euo pipefail
          docker run --rm -d --name phy-ai-socratic-ci -p 18080:8000 \
            -e ENVIRONMENT=development \
            -e DATABASE_URL=sqlite:////tmp/phy_ai_ci.sqlite3 \
            -e SECRET_KEY=ci-only-test-key-please-never-deploy \
            -e LLM_ENABLED=false \
            -e SOCRATIC_TUTOR_ENABLED=false \
            -e SOCRATIC_TUTOR_LLM_ENABLED=false \
            phy-ai-socratic-v16:ci
          trap 'docker logs phy-ai-socratic-ci || true; docker rm -f phy-ai-socratic-ci || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/api/health >/tmp/phy-health.json; then break; fi
            sleep 2
          done
          cat /tmp/phy-health.json
          test "$(curl -s -o /tmp/tutor-off.json -w '%{http_code}' -X POST http://127.0.0.1:18080/api/tutor/start -H 'Content-Type: application/json' -d '{"error_id":"VLN-01"}')" != "500"
          echo 'Smoke checked: /api/health ready, tutor rejects anonymous without 5xx'
